# sign.yml
name: 'sign manifest'

on:
  workflow_dispatch:
  push:

jobs:
  sign:
    runs-on: ubuntu-latest
    name: Sign ffmuc manifest
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Build docker images
      run: docker build -t local < Dockerfile
    - name: Run Sign
      run: docker run -it -v local ${{ secrets.privateKey }}



